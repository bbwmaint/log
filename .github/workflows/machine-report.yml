name: BBW machine report

# Weekly machine-downtime report, emailed to the maintenance team every Monday
# morning for the week that just ended (last complete Monday–Sunday). The PDF is
# captured from the live app in a headless browser, so whatever the in-app report
# shows is what goes out. Idempotent — each week is sent exactly once
# (MACHINE_<start>_<end> in bbw_report_sent). Also runnable by hand (leave
# start/end blank to use the week that just ended; tick dry_run to preview).
#
# Cron: GitHub's scheduled runs are NOT punctual — hour-aligned jobs get queued
# and can fire minutes to hours late. So instead of one tick we fire a catch-up
# window across Monday morning at off-peak minutes (12:07–15:47 UTC ≈ 8–11 AM
# Toronto). A fast pre-check skips the heavy work on every tick after the week is
# already sent, and the once-a-week lock means it still goes out exactly once —
# but close to 8 AM instead of drifting into the afternoon.
on:
  schedule:
    - cron: '7,27,47 12-15 * * 1'
  workflow_dispatch:
    inputs:
      start:
        description: 'Week start (YYYY-MM-DD) — blank = the week that just ended'
        required: false
      end:
        description: 'Week end (YYYY-MM-DD) — blank = derived from start'
        required: false
      dry_run:
        description: 'Print the email instead of sending it'
        type: boolean
        default: false
      force:
        description: 'Send again even if this week was already sent'
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fast gate (built-in fetch only — no npm install, no Chromium). On a
      # scheduled catch-up tick, skip everything heavy if this week is already
      # sent. The first tick GitHub actually runs does the real work.
      - name: Already sent this week?
        id: gate
        if: github.event_name == 'schedule'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          OUT=$(node scripts/machine-report.mjs --check)
          echo "$OUT"
          if echo "$OUT" | grep -q 'SEND=yes'; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install libraries
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.go == 'true'
        run: npm install --no-audit --no-fund
      # The machine PDF is captured from the live app in a headless browser.
      - name: Install Chromium
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.go == 'true'
        run: npx playwright install --with-deps chromium
      - name: Send machine report
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.go == 'true'
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          EMAILJS_PUBLIC_KEY:  ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          EMAILJS_SERVICE:     ${{ vars.EMAILJS_SERVICE  || 'service_q7rtzse' }}
          EMAILJS_TEMPLATE:    ${{ vars.EMAILJS_TEMPLATE || 'template_i01whhv' }}
          # Whole maintenance team. Override with repo variable MACHINE_TO
          # (comma-separated); defaults to the shared maintenance inbox.
          MACHINE_TO:          ${{ vars.MACHINE_TO || 'maintenancebbw@brunswickbierworks.com' }}
          APP_URL:             ${{ vars.APP_URL || 'https://bbwmaint.github.io/log/' }}
        run: |
          node scripts/machine-report.mjs \
            ${{ inputs.start   && format('--start {0}', inputs.start) || '' }} \
            ${{ inputs.end     && format('--end {0}',   inputs.end)   || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force   && '--force'   || '' }}
