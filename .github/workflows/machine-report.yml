name: BBW machine report

# Weekly machine-downtime report, emailed to the maintenance team every Monday
# morning for the week that just ended (last complete Monday–Sunday). The PDF is
# captured from the live app in a headless browser, so whatever the in-app report
# shows is what goes out. Idempotent — each week is sent exactly once
# (MACHINE_<start>_<end> in bbw_report_sent). Also runnable by hand (leave
# start/end blank to use the week that just ended; tick dry_run to preview).
#
# Cron: 12:00 UTC every Monday = 8 AM Toronto in daylight-saving, 7 AM in standard
# time — always Monday morning, which is what the "week that just ended" logic needs.
on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      start:
        description: 'Week start (YYYY-MM-DD) — blank = the week that just ended'
        required: false
      end:
        description: 'Week end (YYYY-MM-DD) — blank = derived from start'
        required: false
      dry_run:
        description: 'Print the email instead of sending it'
        type: boolean
        default: false
      force:
        description: 'Send again even if this week was already sent'
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install libraries
        run: npm install --no-audit --no-fund
      # The machine PDF is captured from the live app in a headless browser.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Send machine report
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          EMAILJS_PUBLIC_KEY:  ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          EMAILJS_SERVICE:     ${{ vars.EMAILJS_SERVICE  || 'service_q7rtzse' }}
          EMAILJS_TEMPLATE:    ${{ vars.EMAILJS_TEMPLATE || 'template_i01whhv' }}
          # Whole maintenance team. Override with repo variable MACHINE_TO
          # (comma-separated); defaults to the shared maintenance inbox.
          MACHINE_TO:          ${{ vars.MACHINE_TO || 'maintenancebbw@brunswickbierworks.com' }}
          APP_URL:             ${{ vars.APP_URL || 'https://bbwmaint.github.io/log/' }}
        run: |
          node scripts/machine-report.mjs \
            ${{ inputs.start   && format('--start {0}', inputs.start) || '' }} \
            ${{ inputs.end     && format('--end {0}',   inputs.end)   || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force   && '--force'   || '' }}
