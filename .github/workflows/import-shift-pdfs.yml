name: BBW import shift PDFs

# Reads BrewQM Packaging Shift Report PDFs from the mailbox and writes the
# volume + productivity into the schedule. Idempotent (each report applied once),
# so extra runs are harmless.
#
# Runs at 7:30, 8:30, 9:30, 10:30 — both AM and PM Toronto time — to cover the
# day-shift and night-shift report windows. GitHub cron is UTC-only with no DST,
# so the UTC hours below are the union that lands on those local times in BOTH
# daylight-saving and standard time (a couple of extra runs, which dedup makes
# free). Also runnable by hand.
on:
  schedule:
    #  :30 past these UTC hours = 7:30/8:30/9:30/10:30 AM & PM in Toronto,
    #  covering both EDT (UTC-4) and EST (UTC-5).
    - cron: '30 0,1,2,3,11,12,13,14,15,23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Parse + print, write nothing'
        type: boolean
        default: false
      lookback:
        description: 'Days of mail to scan (default 7)'
        required: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install libraries
        run: npm install --no-audit --no-fund
      # PDF text extraction uses poppler's pdftotext.
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Import shift PDFs
        env:
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
          IMAP_HOST:     ${{ secrets.IMAP_HOST }}
          IMAP_PORT:     ${{ vars.IMAP_PORT || '993' }}
          IMAP_USER:     ${{ secrets.IMAP_USER }}
          IMAP_PASS:     ${{ secrets.IMAP_PASS }}
          IMAP_FOLDER:   ${{ vars.IMAP_FOLDER || 'INBOX' }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '7' }}
        run: |
          node scripts/import-shift-pdfs.mjs \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.lookback && format('--lookback {0}', inputs.lookback) || '' }}
